line-length = 300
target-version = "py310"
extend-exclude = ["data", ".claude"]

[lint]
# C901 + PLR09xx = size/complexity limits for NEW code. Existing offenders carry `# noqa: <code> - reason`.
select = ["E", "F", "W", "I", "B", "UP", "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915"]
ignore = [
    "B905",  # zip(strict=) would turn today's silent truncation into exceptions: a behaviour change
]

[lint.mccabe]
max-complexity = 12

[lint.pylint]
max-statements = 60
max-branches = 15
max-args = 8
max-returns = 8

[lint.per-file-ignores]
# Tests are long and linear by nature: size limits do not apply.
"tests/**" = ["C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915"]
