[mypy]
python_version = 3.10
files = src, include
explicit_package_bases = True
mypy_path = .
check_untyped_defs = True
warn_unused_ignores = True

[mypy-psychopy.*,pupil_labs.*,cv2.*,pythoncom.*,win32com.*,pywintypes.*,PyQt6.*,flask.*,pyglet.*,numpy.*,scipy.*,matplotlib.*,aiohttp.*,pytest.*,pandas.*]
ignore_missing_imports = True
