[pytest]
testpaths = tests
pythonpath = .
addopts = -n auto --maxprocesses=6 --dist loadgroup -p no:codecov
markers =
    session: session logic, scoring, simulator
    analysis: post-hoc analysis, flash gates, compare, glasses video
    dashboard: Flask dashboard
    gaze: Neon source, gaze trace, head monitor
    run: run_experiment, logger, dialog, file IO
    checks: docs, lint, schema, architecture, constants
